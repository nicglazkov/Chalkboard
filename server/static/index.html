<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Generate a video · Chalkboard</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Serif+Display:ital@0;1&family=Lora:ital,wght@0,400;0,500;1,400&display=swap">
  <link rel="stylesheet" href="/app.css?v=8">
  <script src="/app.js?v=7"></script>
</head>
<body>
<div class="shell">
  <nav class="side" aria-label="Main" data-page="generate"></nav>
  <main class="main" id="main">
    <div class="page page-gen">
      <div class="split">
        <section>
          <h1 class="h1">New video</h1>

          <form id="gen" class="gen-form" novalidate>
           <div class="gen-main">
            <div class="field">
              <label for="topic" class="label">Topic</label>
              <textarea id="topic" class="topic" rows="4" placeholder="How a Fourier transform finds the notes in a chord" aria-describedby="topic-hint"></textarea>
              <div class="under">
                <button type="button" class="pill-btn" id="attach-btn" aria-expanded="false" aria-controls="attach">+ Attach files or links</button>
                <span id="tags" class="chips" aria-live="polite"></span>
                <span class="hint" id="topic-hint"><span id="chars">0 characters</span><span class="kbd-hint"> · <span id="kbd">Ctrl</span>+Enter to generate</span></span>
              </div>
              <div class="attach" id="attach" hidden>
                <button type="button" class="drop" id="drop">Drop files here or click to choose. PDF, DOCX, images, text and code. Folders work too.</button>
                <input type="file" id="file-input" multiple hidden>
                <div class="row">
                  <label class="sr-only" for="url-in">Web page URL</label>
                  <input class="input" id="url-in" type="url" placeholder="https://example.com/article" autocomplete="off" spellcheck="false">
                  <button type="button" class="btn" id="url-add">Add link</button>
                </div>
                <div class="row">
                  <label class="sr-only" for="gh-in">GitHub repo</label>
                  <input class="input" id="gh-in" type="text" placeholder="owner/repo on GitHub" autocomplete="off" spellcheck="false">
                  <button type="button" class="btn" id="gh-add">Add repo</button>
                </div>
                <div class="note" id="attach-note">Per file: text 2 MB, images 5 MB, PDF 20 MB, DOCX 10 MB. 24 MB in total.</div>
              </div>
            </div>

            <div class="toggles">
              <button type="button" class="toggle" id="t-research" aria-pressed="false">
                <span class="box" aria-hidden="true"></span>
                <span><span class="t">Deep research</span><span class="s">Searches the web and fact-checks harder before writing. Runs at high effort.</span></span>
              </button>
              <button type="button" class="toggle" id="t-quiz" aria-pressed="false">
                <span class="box" aria-hidden="true"></span>
                <span><span class="t">Write a quiz</span><span class="s">Multiple-choice questions with explanations</span></span>
              </button>
            </div>
           </div>

           <div class="gen-opts">
            <details class="disc" id="style">
              <summary><span class="t">Style</span><span class="sum" id="style-sum"></span><span class="chev" aria-hidden="true">▾</span></summary>
              <div class="disc-body">
                <div class="label" id="voices-label">Narrator</div>
                <div class="voices" id="voices" role="radiogroup" aria-labelledby="voices-label"></div>
                <p id="voices-note" class="note-s" hidden></p>
                <div class="opt-row"><span class="label" id="l-aud">Audience</span><div class="chips" data-key="audience" role="group" aria-labelledby="l-aud"></div></div>
                <div class="opt-row"><span class="label" id="l-tone">Tone</span><div class="chips" data-key="tone" role="group" aria-labelledby="l-tone"></div></div>
                <div class="opt-row"><span class="label" id="l-theme">Theme</span><div class="chips" data-key="theme" role="group" aria-labelledby="l-theme"></div></div>
                <div class="opt-row"><span class="label" id="l-tpl" title="A layout pattern for the animation. Auto lets Claude pick one.">Template</span><div class="chips" data-key="template" role="group" aria-labelledby="l-tpl"></div></div>
              </div>
            </details>

            <details class="disc" id="output">
              <summary><span class="t">Output</span><span class="sum" id="output-sum"></span><span class="chev" aria-hidden="true">▾</span></summary>
              <div class="disc-body">
                <div class="opt-row"><span class="label" id="l-res">Resolution</span><div class="chips" data-key="quality" role="group" aria-labelledby="l-res"></div></div>
                <div class="opt-row"><span class="label" id="l-eff" title="How much thinking Claude puts into the script and animation code">Effort</span><div class="chips" data-key="effort" role="group" aria-labelledby="l-eff"></div></div>
                <div class="opt-row"><span class="label" id="l-qa" title="After rendering, Claude looks at frames for visual problems and fixes them">Visual QA</span><div class="chips" data-key="qa_density" role="group" aria-labelledby="l-qa"></div></div>
                <div class="opt-row"><label class="label" for="speed">Speed</label><div class="chips"><input class="input num" id="speed" type="number" min="0.25" max="4" step="0.05" value="1.0" inputmode="decimal"><span class="mono muted" style="align-self:center">× narration speed (1 is normal)</span></div></div>
                <div class="opt-row"><span class="label">Captions</span><label class="check-line"><input type="checkbox" id="burn"> Burn captions into the video</label></div>
              </div>
            </details>

           </div>

           <div class="gen-submit">
            <div id="form-error" hidden></div>
            <div class="submit-row">
              <button type="submit" class="btn primary big" id="submit">Generate video</button>
              <span class="est-line" id="est-line"></span>
            </div>
           </div>
          </form>
        </section>

        <aside>
          <div class="card" id="est-card" aria-live="polite">
            <div class="label">Estimated time</div>
            <div class="shimmer" style="height:2.75rem"></div>
          </div>
          <div class="card recent">
            <div class="card-head"><span class="label">Recent</span><a class="right" href="/library">See all</a></div>
            <div id="recent"><div class="shimmer" style="height:7.5rem"></div></div>
          </div>
        </aside>
      </div>
    </div>
  </main>
</div>

<script>
(function () {
  const { esc, cap, fmtBytes, fmtSpan, fmtDuration, fmtAgo, parseTs, fmtUsd, getJSON, missingWhy, getVoices, getMeta, resLabel, resFull, unknownHtml, buildWorkbench, getJobs, thumbInner } = window.CB;
  const $ = (id) => document.getElementById(id);

  const OPTIONS = {
    audience: [['beginner', 'beginner'], ['intermediate', 'intermediate'], ['expert', 'expert']],
    tone: [['casual', 'casual'], ['formal', 'formal'], ['socratic', 'socratic']],
    theme: [['chalkboard', 'chalkboard'], ['light', 'light'], ['colorful', 'colorful']],
    template: [['', 'auto'], ['algorithm', 'algorithm'], ['code', 'code'], ['compare', 'compare'], ['derivation', 'derivation'], ['howto', 'how-to'], ['timeline', 'timeline']],
    quality: [['low', '480p'], ['medium', '720p'], ['high', '1080p'], ['4k', '4K']],
    effort: [['low', 'low'], ['medium', 'medium']],
    qa_density: [['zero', 'off'], ['normal', 'normal'], ['high', 'high']],
  };
  const S = {
    audience: 'intermediate', tone: 'casual', theme: 'chalkboard', template: '', quality: 'high',
    effort: 'medium', qa_density: 'normal', research: false, quiz: false, narrator: null,
    speed: 1.0, burn: false, files: [], urls: [], github: [], skipped: 0,
  };
  let voices = [];

  // ── Chip groups ────────────────────────────────────────────────────────
  function renderChips() {
    document.querySelectorAll('.chips[data-key]').forEach((g) => {
      const key = g.dataset.key;
      g.innerHTML = OPTIONS[key].map(([v, label]) => {
        const lockHigh = key === 'effort' && S.research;
        const on = lockHigh ? false : S[key] === v;
        return `<button type="button" class="chip" data-v="${esc(v)}" aria-pressed="${on}"${lockHigh ? ' disabled title="Deep research runs at high effort"' : ''}>${esc(label)}</button>`;
      }).join('') + (key === 'effort' && S.research ? '<span class="mono c-gold" style="align-self:center">high (deep research)</span>' : '');
    });
  }
  document.querySelectorAll('.chips[data-key]').forEach((g) => g.addEventListener('click', (e) => {
    const b = e.target.closest('.chip');
    if (!b || b.disabled) return;
    S[g.dataset.key] = b.dataset.v;
    changed();
  }));

  function toggle(id, key) {
    $(id).addEventListener('click', () => { S[key] = !S[key]; changed(); });
  }
  toggle('t-research', 'research');
  toggle('t-quiz', 'quiz');
  $('speed').addEventListener('input', () => { S.speed = parseFloat($('speed').value) || 1.0; summaries(); });
  $('burn').addEventListener('change', () => { S.burn = $('burn').checked; summaries(); });

  function voiceLabel() {
    const v = voices.find((x) => x.id === S.narrator);
    return v ? v.label : 'server default voice';
  }
  function summaries() {
    $('style-sum').textContent = [voiceLabel().toLowerCase(), S.audience, S.tone, S.theme, S.template ? S.template + ' template' : 'auto template'].join(' · ');
    $('output-sum').textContent = [resFull(S.quality), S.research ? 'high effort' : S.effort + ' effort', S.qa_density === 'zero' ? 'visual QA off' : 'visual QA ' + S.qa_density, `${S.speed}x speed`, S.burn ? 'burned captions' : 'captions file'].join(' · ');
  }
  function changed() {
    $('t-research').setAttribute('aria-pressed', S.research);
    $('t-research').querySelector('.box').textContent = S.research ? '✓' : '';
    $('t-quiz').setAttribute('aria-pressed', S.quiz);
    $('t-quiz').querySelector('.box').textContent = S.quiz ? '✓' : '';
    renderChips();
    renderVoices();
    summaries();
    queueEstimate();
  }

  // ── Voices ─────────────────────────────────────────────────────────────
  let voiceSource = null;
  const sampleFail = {};   // id -> reason the sample could not play
  let audio = null, playing = null;
  function renderVoices() {
    const host = $('voices');
    if (!voices.length) {
      host.innerHTML = `<div class="mono muted">${esc(voiceSource && voiceSource.why ? voiceSource.why : 'Loading voices')}</div>`;
      return;
    }
    host.innerHTML = voices.map((v) => {
      const on = S.narrator === v.id;
      const off = v.available === false;
      let why = '';
      if (off) why = v.availability_reason || 'Not available on this server';
      let hearWhy = '';
      if (voiceSource.source !== 'voices') hearWhy = voiceSource.why || 'Samples are not available';
      else if (off) hearWhy = 'Voice not available';
      else if (!v.sample_url) hearWhy = 'No sample for this voice';
      else if (sampleFail[v.id]) hearWhy = sampleFail[v.id];
      const hear = playing === v.id ? '■ Stop' : (hearWhy ? 'No sample' : '▶ Hear');
      const avail = v.available == null ? 'availability unknown' : '';
      const availTip = v.available == null && v.availability_reason ? v.availability_reason : '';
      const bk = [v.backend, v.model, avail].filter(Boolean).join(' · ');
      return `<div class="voice${on ? ' on' : ''}${off ? ' off' : ''}">
        <button type="button" class="pick" role="radio" aria-checked="${on}" data-id="${esc(v.id)}" aria-label="${esc(v.label)}${off ? ', not available' : ''}"${off ? ' disabled' : ''}${why || sampleFail[v.id] ? ` title="${esc(why || sampleFail[v.id])}"` : ''}></button>
        <span class="top"><span class="nm">${esc(v.label)}</span>
          <button type="button" class="hear" data-hear="${esc(v.id)}"${hearWhy ? ` disabled title="${esc(hearWhy)}"` : ''} aria-label="${playing === v.id ? 'Stop' : 'Hear'} ${esc(v.label)}">${hear}</button></span>
        ${v.tagline ? `<span class="tag">${esc(v.tagline)}</span>` : ''}
        ${bk ? `<span class="bk"${availTip ? ` title="${esc(availTip)}"` : ''}>${esc(bk)}</span>` : ''}
        ${why ? `<span class="why" title="${esc(why)}">${esc(why)}</span>` : ''}
        ${sampleFail[v.id] && !off ? `<span class="why" title="${esc(sampleFail[v.id])}">${esc(sampleFail[v.id])}</span>` : ''}
      </div>`;
    }).join('');
  }
  $('voices').addEventListener('click', async (e) => {
    const hear = e.target.closest('[data-hear]');
    if (hear) {
      e.stopPropagation();
      const id = hear.dataset.hear;
      if (playing === id) { audio && audio.pause(); playing = null; renderVoices(); return; }
      if (audio) audio.pause();
      const v = voices.find((x) => x.id === id);
      hear.textContent = 'Loading';
      hear.disabled = true;
      try {
        const r = await fetch(v.sample_url);
        if (!r.ok) {
          let why = `Sample failed (HTTP ${r.status})`;
          try { const j = await r.json(); if (j && j.detail) why = typeof j.detail === 'string' ? j.detail : JSON.stringify(j.detail); } catch {}
          sampleFail[id] = why;
          renderVoices();
          return;
        }
        const blob = await r.blob();
        audio = new Audio(URL.createObjectURL(blob));
        audio.addEventListener('ended', () => { playing = null; renderVoices(); });
        await audio.play();
        playing = id;
      } catch (err) {
        sampleFail[id] = 'Could not play the sample';
      }
      renderVoices();
      return;
    }
    const pick = e.target.closest('.pick');
    if (!pick || pick.disabled) return;
    S.narrator = S.narrator === pick.dataset.id ? null : pick.dataset.id;
    changed();
  });

  // ── Attachments ────────────────────────────────────────────────────────
  const FILE_LIMITS = { text: 2 * 1024 * 1024, image: 5 * 1024 * 1024, pdf: 20 * 1024 * 1024, docx: 10 * 1024 * 1024 };
  const TOTAL_LIMIT = 24 * 1024 * 1024;
  // Fallback lists; replaced by the server's own rules from /api/meta (upload).
  let TEXT_NAMES = new Set(['Makefile', 'makefile', 'GNUmakefile', 'Dockerfile', 'dockerfile', 'LICENSE', 'LICENCE', 'README', 'CHANGELOG', 'Gemfile', 'Rakefile', 'Procfile', '.gitignore', '.dockerignore', '.editorconfig']);
  let TEXT_EXTS = new Set(['.txt', '.md', '.py', '.js', '.ts', '.jsx', '.tsx', '.go', '.rs', '.java', '.c', '.cpp', '.h', '.hpp', '.rb', '.swift', '.kt', '.sh', '.bash', '.zsh', '.bat', '.ps1', '.yaml', '.yml', '.json', '.toml', '.csv', '.html', '.css', '.scss', '.xml', '.ini', '.env', '.sql', '.graphql', '.proto', '.tf', '.hcl', '.vue', '.php', '.scala', '.dart', '.elm']);
  let IMAGE_EXTS = new Set(['.png', '.jpg', '.jpeg', '.gif', '.webp']);
  function applyUploadRules(u) {
    if (!u || !Array.isArray(u.text_extensions)) return;
    TEXT_EXTS = new Set(u.text_extensions);
    TEXT_NAMES = new Set(u.text_filenames || []);
    if (Array.isArray(u.image_extensions)) IMAGE_EXTS = new Set(u.image_extensions);
    if (u.limits) Object.assign(FILE_LIMITS, u.limits);
  }
  function fileCategory(f) {
    if (TEXT_NAMES.has(f.name)) return 'text';
    const dot = f.name.lastIndexOf('.');
    const ext = dot > 0 ? f.name.slice(dot).toLowerCase() : '';
    if (IMAGE_EXTS.has(ext)) return 'image';
    if (ext === '.pdf') return 'pdf';
    if (ext === '.docx') return 'docx';
    if (TEXT_EXTS.has(ext)) return 'text';
    return 'unsupported';
  }
  function validateFile(f) {
    const c = fileCategory(f);
    if (c === 'unsupported') return 'Unsupported type';
    if (f.size > FILE_LIMITS[c]) return `Over the ${fmtBytes(FILE_LIMITS[c])} limit`;
    return null;
  }
  const totalSize = () => S.files.reduce((a, x) => a + x.file.size, 0);
  const filesInvalid = () => totalSize() > TOTAL_LIMIT || S.files.some((x) => x.error);
  function renderTags() {
    const tags = [
      ...S.files.map((x, i) => `<span class="chip tag${x.error ? ' bad' : ''}" title="${esc(x.error ? x.error : fmtBytes(x.file.size))}"><span class="nm">${esc(x.file.name)}</span>${x.error ? `<span class="c-danger">${esc(x.error)}</span>` : ''}<button type="button" class="x" data-rm="f${i}" aria-label="Remove ${esc(x.file.name)}">✕</button></span>`),
      ...S.urls.map((u, i) => `<span class="chip tag"><span class="k">link</span><span class="nm">${esc(u)}</span><button type="button" class="x" data-rm="u${i}" aria-label="Remove ${esc(u)}">✕</button></span>`),
      ...S.github.map((u, i) => `<span class="chip tag"><span class="k">repo</span><span class="nm">${esc(u)}</span><button type="button" class="x" data-rm="g${i}" aria-label="Remove ${esc(u)}">✕</button></span>`),
    ];
    $('tags').innerHTML = tags.join('');
    const t = totalSize();
    $('attach-note').innerHTML = esc('Per file: text 2 MB, images 5 MB, PDF 20 MB, DOCX 10 MB. 24 MB in total.') + (S.files.length ? ` <span class="${t > TOTAL_LIMIT ? 'c-danger' : ''}">${esc(fmtBytes(t))} attached.</span>` : '') +
      (S.skipped ? ` ${esc(`Skipped ${S.skipped} unsupported file${S.skipped === 1 ? '' : 's'} from the dropped folder.`)}` : '');
    $('submit').disabled = filesInvalid();
  }
  $('tags').addEventListener('click', (e) => {
    const b = e.target.closest('[data-rm]');
    if (!b) return;
    const k = b.dataset.rm[0], i = Number(b.dataset.rm.slice(1));
    ({ f: S.files, u: S.urls, g: S.github })[k].splice(i, 1);
    renderTags();
  });
  function addFiles(list) {
    for (const file of list) {
      if (S.files.some((x) => x.file.name === file.name && x.file.size === file.size)) continue;
      S.files.push({ file, error: validateFile(file) });
    }
    renderTags();
  }
  $('attach-btn').addEventListener('click', () => {
    const open = $('attach').hidden;
    $('attach').hidden = !open;
    $('attach-btn').setAttribute('aria-expanded', String(open));
  });
  $('drop').addEventListener('click', () => $('file-input').click());
  $('file-input').addEventListener('change', () => { S.skipped = 0; addFiles(Array.from($('file-input').files)); $('file-input').value = ''; });
  $('drop').addEventListener('dragover', (e) => { e.preventDefault(); $('drop').classList.add('over'); });
  $('drop').addEventListener('dragleave', () => $('drop').classList.remove('over'));
  // Dropped folders are walked recursively; their unsupported files are skipped
  // (counted, not listed), while individually dropped files are always listed.
  const SKIP_DIRS = new Set(['.git', 'node_modules', '__pycache__', '.venv', 'venv', 'dist', 'build', '.next']);
  const readEntries = (dir) => new Promise((res) => {
    const reader = dir.createReader(), out = [];
    const next = () => reader.readEntries((batch) => { if (!batch.length) return res(out); out.push(...batch); next(); }, () => res(out));
    next();
  });
  const entryFile = (entry) => new Promise((res) => entry.file(res, () => res(null)));
  async function walk(entry, out, depth = 0) {
    if (entry.isFile) { const f = await entryFile(entry); if (f) out.push(f); return; }
    if (!entry.isDirectory || depth > 12 || SKIP_DIRS.has(entry.name)) return;
    for (const child of await readEntries(entry)) await walk(child, out, depth + 1);
  }
  $('drop').addEventListener('drop', async (e) => {
    e.preventDefault(); $('drop').classList.remove('over');
    const dt = e.dataTransfer;
    S.skipped = 0;
    // Take the entries before any await: the DataTransfer is emptied after the handler yields.
    const entries = Array.from(dt.items || []).map((it) => (it.kind === 'file' && it.webkitGetAsEntry ? it.webkitGetAsEntry() : null));
    if (!entries.length || entries.some((x) => !x)) { addFiles(Array.from(dt.files || [])); return; }
    const loose = [], fromDirs = [];
    for (const en of entries) {
      if (en.isDirectory) await walk(en, fromDirs);
      else { const f = await entryFile(en); if (f) loose.push(f); }
    }
    const usable = fromDirs.filter((f) => fileCategory(f) !== 'unsupported');
    S.skipped = fromDirs.length - usable.length;
    addFiles([...loose, ...usable]);
  });
  function addFrom(inputId, list, check) {
    const el = $(inputId);
    const v = el.value.trim();
    if (!v) return;
    const bad = check(v);
    if (bad) { el.setCustomValidity(bad); el.reportValidity(); return; }
    el.setCustomValidity('');
    if (!list.includes(v)) list.push(v);
    el.value = '';
    renderTags();
  }
  const addUrl = () => addFrom('url-in', S.urls, (v) => (/^https?:\/\/\S+\.\S+/.test(v) ? '' : 'Use a full link starting with https://'));
  const addGh = () => addFrom('gh-in', S.github, (v) => (/^[\w.-]+\/[\w.-]+$/.test(v.replace(/^https?:\/\/github\.com\//, '').replace(/\/$/, '')) ? '' : 'Use owner/repo, for example nicglazkov/Chalkboard'));
  $('url-add').addEventListener('click', addUrl);
  $('gh-add').addEventListener('click', addGh);
  $('url-in').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); addUrl(); } });
  $('gh-in').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); addGh(); } });
  $('url-in').addEventListener('input', () => $('url-in').setCustomValidity(''));
  $('gh-in').addEventListener('input', () => $('gh-in').setCustomValidity(''));

  // ── Topic ──────────────────────────────────────────────────────────────
  const topic = $('topic');
  if (/Mac|iPhone|iPad/.test(navigator.platform)) $('kbd').textContent = '⌘';
  // Grows with its text up to about 60% of the window, then scrolls. A manual
  // resize (the corner handle) turns auto-sizing off.
  let topicManual = false, topicAutoH = 0;
  function fitTopic() {
    if (topicManual) return;
    topic.style.height = 'auto';
    const max = Math.max(topic.offsetHeight, Math.round(window.innerHeight * 0.6));
    topicAutoH = Math.min(topic.scrollHeight + 2, max);
    topic.style.height = topicAutoH + 'px';
  }
  topic.addEventListener('pointerup', () => { if (topicAutoH && Math.abs(topic.offsetHeight - topicAutoH) > 4) topicManual = true; });
  topic.addEventListener('input', () => { const n = topic.value.trim().length; $('chars').textContent = `${n} character${n === 1 ? '' : 's'}`; fitTopic(); });
  window.addEventListener('resize', fitTopic);
  topic.addEventListener('keydown', (e) => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); $('gen').requestSubmit(); } });

  // ── Estimate (from finished runs with matching settings) ───────────────
  let estTimer = null, estSeq = 0;
  function queueEstimate() { clearTimeout(estTimer); estTimer = setTimeout(loadEstimate, 250); }
  async function loadEstimate() {
    const seq = ++estSeq;
    const effort = S.research ? 'high' : S.effort;
    const p = new URLSearchParams({ effort, quality: S.quality || '', narrator: S.narrator || '', research: String(S.research) });
    const res = await getJSON(`/api/estimate?${p}`);
    if (seq !== estSeq) return;
    const card = $('est-card');
    const line = $('est-line');
    if (!res.ok || !res.data) {
      const why = missingWhy(res, 'The estimate');
      card.innerHTML = `<div class="label">Estimated time</div><div class="big-num unk">Unknown</div><p class="note-s">${esc(why)}</p>`;
      line.innerHTML = unknownHtml(why, 'Typical cost unknown');
      return;
    }
    const d = res.data;
    const n = d.based_on_runs || 0;
    if (d.median_seconds == null) {
      card.innerHTML = `<div class="label">Estimated time</div><div class="big-num unk">Not enough runs yet</div>
        <p class="note-s">An estimate appears once 3 runs with similar settings have finished. ${n ? `${esc(String(n))} so far.` : 'None so far.'}</p>`;
    } else {
      const big = d.median_seconds >= 60 ? `~${Math.round(d.median_seconds / 60)} min` : `~${Math.round(d.median_seconds)} s`;
      const range = d.p25_seconds != null && d.p75_seconds != null ? `${fmtSpan(d.p25_seconds)} to ${fmtSpan(d.p75_seconds)}` : null;
      card.innerHTML = `<div class="label">Estimated time</div><div class="big-num">${esc(big)}</div>
        <div class="kv"><span>Middle half of runs</span><span>${range ? esc(range) : unknownHtml('Not enough runs for a range')}</span></div>
        <div class="kv"><span>Typical cost</span><span>${d.median_cost_usd != null ? esc(fmtUsd(d.median_cost_usd)) : unknownHtml('These runs did not record a cost')}</span></div>
        <div class="kv"><span>Based on</span><span>${esc(String(n))} finished run${n === 1 ? '' : 's'}${d.basis === 'same_quality' ? ', same resolution' : d.basis === 'exact' ? ', same settings' : ''}</span></div>`;
    }
    line.innerHTML = d.median_cost_usd != null
      ? `Typical cost ${esc(fmtUsd(d.median_cost_usd))}, the median of ${esc(String(n))} similar runs`
      : unknownHtml(n < 3 ? 'Fewer than 3 similar runs have finished' : 'Similar runs did not record a cost', 'Typical cost unknown');
  }

  // ── Recent ─────────────────────────────────────────────────────────────
  async function loadRecent() {
    const [lib, jobs, vs] = await Promise.all([getJSON('/api/library?limit=6&sort=newest'), getJobs(), getVoices()]);
    const rows = [];
    if (jobs.ok && Array.isArray(jobs.data)) {
      for (const j of jobs.data.filter((x) => x.status === 'running' || x.status === 'pending').slice(0, 2)) {
        const wb = buildWorkbench(j);
        rows.push(`<a href="/progress/?job=${encodeURIComponent(j.id)}"><span class="thumb dim"><div class="thumb-board"><span>${esc(j.topic)}</span></div><span class="bar"></span></span><span class="tx"><span class="t">${esc(j.topic)}</span><span class="m c-gold">${j.status === 'pending' ? 'Queued' : 'Running'}${wb.active ? ' · ' + esc(wb.active.name.toLowerCase()) : ''}</span></span></a>`);
      }
    }
    if (lib.ok && lib.data) {
      for (const v of lib.data.videos.slice(0, 6 - Math.min(rows.length, 2))) {
        const meta = [fmtDuration(v.duration_sec), fmtAgo(parseTs(v.created_at))].filter(Boolean).join(' · ');
        rows.push(`<a href="/library/${encodeURIComponent(v.run_id)}"><span class="thumb">${thumbInner(v)}</span><span class="tx"><span class="t">${esc(v.title || v.topic)}</span><span class="m">${esc(meta)}</span></span></a>`);
      }
    }
    $('recent').innerHTML = rows.length ? rows.join('') : (lib.ok ? '<p class="note-s">No videos yet.</p>' : `<p class="note-s">${esc(missingWhy(lib, 'The library'))}</p>`);
  }

  // ── Submit ─────────────────────────────────────────────────────────────
  function showError(html) { $('form-error').innerHTML = html; $('form-error').hidden = false; }
  $('gen').addEventListener('submit', async (e) => {
    e.preventDefault();
    $('form-error').hidden = true;
    const t = topic.value.trim();
    if (!t) { showError('<div class="err"><div class="err-title">Add a topic first</div><p class="muted">One clear sentence is enough.</p></div>'); topic.focus(); return; }
    if (filesInvalid()) { showError('<div class="err"><div class="err-title">Some attachments cannot be sent</div><p class="muted">Remove the files marked in red, or keep the total under 24 MB.</p></div>'); return; }
    const body = {
      topic: t,
      effort: S.research ? 'high' : S.effort,
      audience: S.audience, tone: S.tone, theme: S.theme,
      template: S.template || null,
      speed: S.speed || 1.0,
      burn_captions: S.burn, quiz: S.quiz,
      qa_density: S.qa_density,
      quality: S.quality || null,
      narrator: S.narrator || null,
      urls: S.urls, github: S.github,
    };
    const btn = $('submit');
    btn.disabled = true;
    btn.textContent = 'Starting';
    let res;
    if (S.files.length) {
      const fd = new FormData();
      for (const [k, v] of Object.entries(body)) {
        if (Array.isArray(v)) v.forEach((x) => fd.append(k, x));
        else if (v != null) fd.append(k, typeof v === 'boolean' ? String(v) : v);
      }
      for (const { file } of S.files) fd.append('files', file);
      res = await getJSON('/api/jobs/upload', { method: 'POST', body: fd });
    } else {
      res = await getJSON('/api/jobs', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    }
    if (!res.ok || !res.data || !res.data.id) {
      btn.disabled = false;
      btn.textContent = 'Generate video';
      showError(`<div class="err" role="alert"><div class="err-title">The server did not start the job</div><p class="muted">${esc(res.error || 'No response.')}${res.status ? ` (HTTP ${res.status})` : ''}</p></div>`);
      return;
    }
    location.href = `/progress/?job=${encodeURIComponent(res.data.id)}`;
  });

  // ── Defaults and prefill ───────────────────────────────────────────────
  const params = new URLSearchParams(location.search);
  const prefilled = params.has('topic');
  function applyPrefill() {
    for (const k of ['audience', 'tone', 'theme', 'template', 'quality', 'qa_density']) if (params.has(k)) S[k] = params.get(k);
    const eff = params.get('effort');
    if (eff === 'high') S.research = true; else if (eff) S.effort = eff;
    if (params.has('speed')) S.speed = parseFloat(params.get('speed')) || 1.0;
    if (params.get('quiz') === 'true') S.quiz = true;
    if (params.get('burn_captions') === 'true') S.burn = true;
    if (params.get('narrator')) S.narrator = params.get('narrator');
    topic.value = params.get('topic') || '';
    $('speed').value = S.speed;
    $('burn').checked = S.burn;
    $('style').open = true;
    $('output').open = true;
    history.replaceState(null, '', '/');
  }

  // On very wide windows the options sit in their own column, open, beside the topic.
  if (getComputedStyle($('gen')).display === 'grid') { $('style').open = true; $('output').open = true; }

  (async function init() {
    const meta = await getMeta();
    applyUploadRules(meta && meta.upload);
    const d = (meta && meta.defaults) || {};
    if (!prefilled) {
      for (const k of ['audience', 'tone', 'theme', 'quality']) if (d[k]) S[k] = d[k];
      if (d.effort === 'high') S.research = true; else if (d.effort) S.effort = d.effort;
      if (d.narrator) S.narrator = d.narrator;
    } else applyPrefill();
    fitTopic();
    voiceSource = await getVoices();
    voices = voiceSource.list || [];
    if (S.narrator && !voices.some((v) => v.id === S.narrator && v.available !== false)) S.narrator = null;
    if (voiceSource.source !== 'voices') { $('voices-note').hidden = false; $('voices-note').textContent = voiceSource.why || ''; }
    topic.dispatchEvent(new Event('input'));
    changed();
    renderTags();
  })();
  renderChips();
  summaries();
  loadRecent();
})();
</script>
</body>
</html>
