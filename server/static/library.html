<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Library · Chalkboard</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Serif+Display:ital@0;1&family=Lora:ital,wght@0,400;0,500;1,400&display=swap">
  <link rel="stylesheet" href="/app.css?v=8">
  <script src="/app.js?v=7"></script>
</head>
<body>
<div class="shell">
  <nav class="side" aria-label="Main" data-page="library"></nav>
  <main class="main" id="main">
    <div class="page page-lib">
      <div class="lib-top">
        <div>
          <h1 class="h1">Library</h1>
        </div>
        <div class="lib-tools" role="search">
          <label for="q" class="sr-only">Search the library</label>
          <input id="q" class="input" type="search" placeholder="Search by topic, transcript or notes" autocomplete="off">
          <label for="sort" class="sr-only">Sort</label>
          <select id="sort" class="input">
            <option value="newest">Newest</option>
            <option value="oldest">Oldest</option>
            <option value="longest">Longest</option>
            <option value="shortest">Shortest</option>
          </select>
        </div>
      </div>

      <div class="kpis" id="kpis" aria-label="Library stats">
        <div class="kpi"><div class="label">This week</div><div class="shimmer" style="height:36px;margin-top:6px"></div></div>
        <div class="kpi"><div class="label">Narration sync</div><div class="shimmer" style="height:36px;margin-top:6px"></div></div>
        <div class="kpi"><div class="label">Visual QA</div><div class="shimmer" style="height:36px;margin-top:6px"></div></div>
        <div class="kpi"><div class="label">Typical run</div><div class="shimmer" style="height:36px;margin-top:6px"></div></div>
      </div>

      <div class="chips" id="filters" role="group" aria-label="Filter by status">
        <button type="button" class="chip" data-f="all" aria-pressed="true">All</button>
        <button type="button" class="chip" data-f="done" aria-pressed="false">Done</button>
        <button type="button" class="chip" data-f="running" aria-pressed="false">Running</button>
        <button type="button" class="chip" data-f="failed" aria-pressed="false">Failed</button>
      </div>

      <div id="list"><div class="shimmer" style="height:300px"></div></div>
      <div class="pager" id="pager" hidden></div>
      <div class="foot" id="foot"></div>
    </div>
  </main>
</div>

<script>
(function () {
  const { esc, fmtDuration, fmtAgo, fmtSpan, fmtStamp, parseTs, getJSON, missingWhy, thumbInner, resLabel, getVoices, narratorName, buildWorkbench, getJobs } = window.CB;
  const $ = (id) => document.getElementById(id);
  const PAGE = 30;
  const params = new URLSearchParams(location.search);
  const st = { q: params.get('q') || '', sort: params.get('sort') || 'newest', f: params.get('f') || 'all', limit: PAGE };
  $('q').value = st.q;
  $('sort').value = st.sort;
  let voiceList = [];

  function saveUrl() {
    const p = new URLSearchParams();
    if (st.q) p.set('q', st.q);
    if (st.sort !== 'newest') p.set('sort', st.sort);
    if (st.f !== 'all') p.set('f', st.f);
    history.replaceState(null, '', p.toString() ? `/library?${p}` : '/library');
  }
  function paintFilters() {
    document.querySelectorAll('#filters .chip').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.f === st.f)));
  }

  // ── KPIs from /api/stats ───────────────────────────────────────────────
  async function loadStats() {
    const r = await getJSON('/api/stats');
    const tile = (k, v, sub, why, tip) => `<div class="kpi"${tip ? ` title="${esc(tip)}"` : ''}><div class="label">${esc(k)}</div>${v != null
      ? `<div class="v">${esc(v)}</div>` : `<div class="v unk" tabindex="0" title="${esc(why)}" aria-label="Unknown. ${esc(why)}">Unknown</div>`}<div class="sub">${esc(sub)}</div></div>`;
    if (!r.ok || !r.data) {
      const why = missingWhy(r, 'Library stats');
      $('kpis').innerHTML = tile('This week', null, 'videos made', why) + tile('Narration sync', null, 'typical animation delay', why) +
        tile('Visual QA', null, 'pass rate', why) + tile('Typical run', null, 'median run time', why);
      return;
    }
    const d = r.data;
    const rate = d.qa_pass_rate == null ? null : (d.qa_pass_rate > 1 ? d.qa_pass_rate : d.qa_pass_rate * 100);
    $('kpis').innerHTML =
      tile('This week', d.videos_this_week != null ? String(d.videos_this_week) : null,
        d.videos_total != null ? `${d.videos_total} in total` : 'videos made', 'The server did not return a weekly count') +
      tile('Narration sync', d.median_sync_lag_s != null ? `${Number(d.median_sync_lag_s).toFixed(2)} s` : null,
        `typical animation delay · ${d.sync_runs || 0} run${d.sync_runs === 1 ? '' : 's'}`, d.sync_runs ? 'The server did not return a median' : 'No run has a recorded cue log yet, so sync has never been measured',
        'How long animations start after the word they are timed to, by the renderer\'s clock. Lower is better.') +
      tile('Visual QA', rate != null ? `${Math.round(rate)}%` : null,
        `passed · ${d.qa_runs || 0} run${d.qa_runs === 1 ? '' : 's'} checked`, d.qa_runs ? 'The server did not return a pass rate' : 'No run has a saved visual QA report yet',
        'Share of checked runs where Claude found no visual problems in the rendered frames.') +
      tile('Typical run', d.median_run_seconds != null ? fmtSpan(d.median_run_seconds) : null,
        `median of ${d.timed_runs || 0} timed run${d.timed_runs === 1 ? '' : 's'}`, d.timed_runs ? 'The server did not return a median' : 'No run has recorded its start and finish times yet',
        'From starting a video to the finished file.');
    const t = parseTs(d.computed_at);
    $('kpis').title = t ? `Computed ${fmtStamp(d.computed_at)}` : '';
    statsNote = t ? `Stats computed ${fmtAgo(t)}` : '';
    paintFoot();
  }

  // ── Rows ───────────────────────────────────────────────────────────────
  let statsNote = '', totalNote = '';
  function paintFoot() { $('foot').textContent = ['Chalkboard · MIT License', totalNote, statsNote].filter(Boolean).join(' · '); }
  function videoRow(v) {
    const meta = [v.effort ? `${v.effort} effort` : '', resLabel(v.quality)].filter(Boolean).join(' · ');
    const n = v.notes ? String(v.notes).replace(/\s+/g, ' ') : '';
    const noteTag = n ? `<span class="note-tag" title="${esc(n.length > 80 ? n.slice(0, 80).trimEnd() + '…' : n)}">note</span>` : '';
    return `<a class="vrow" href="/library/${encodeURIComponent(v.run_id)}">
      <span class="thumb">${thumbInner(v)}</span>
      <span class="tw"><span class="title">${esc(v.title || v.topic)}</span><span class="meta">${esc(meta)}${noteTag}</span></span>
      <span class="st done">Done</span>
      ${v.narrator ? `<span class="vo">${esc(narratorName(v.narrator, voiceList))}</span>` : '<span class="vo nr" title="The narrator was not recorded for this run">Not recorded</span>'}
      <span class="ln">${esc(fmtDuration(v.duration_sec) || '')}</span>
      <span class="wh">${esc(fmtAgo(parseTs(v.created_at)))}</span></a>`;
  }
  function jobRow(j) {
    const wb = buildWorkbench(j);
    const running = j.status === 'running' || j.status === 'pending';
    const t0 = parseTs(j.created_at) || wb.startTs;
    const meta = [j.effort ? `${j.effort} effort` : '', resLabel(j.quality), t0 ? `started ${fmtAgo(t0)}` : ''].filter(Boolean).join(' · ');
    let status, cls;
    if (j.status === 'pending') { status = '● Queued'; cls = 'c-gold'; }
    else if (running) {
      const r = wb.render;
      const where = r && r.segment != null && r.segments ? `scene ${r.segment + 1} of ${r.segments}` : (wb.active ? wb.active.name.toLowerCase() : '');
      status = `● Running${where ? ' · ' + where : ''}`; cls = 'c-gold';
    } else { status = 'Failed'; cls = 'c-danger'; }
    return `<a class="vrow${running ? ' running' : ''}" href="/progress/?job=${encodeURIComponent(j.id)}">
      <span class="thumb dim"><div class="thumb-board"><span>${esc(j.topic)}</span></div>${running ? '<span class="bar"></span>' : ''}</span>
      <span class="tw"><span class="title">${esc(j.topic)}</span><span class="meta">${esc(meta)}</span></span>
      <span class="st ${cls}">${esc(status)}</span>
      <span class="vo">${esc(narratorName(j.narrator, voiceList) || 'Default')}</span>
      <span class="ln"></span>
      <span class="wh">${running ? 'now' : esc(t0 ? fmtAgo(wb.lastTs || t0) : '')}</span></a>`;
  }

  let seq = 0;
  async function load() {
    const my = ++seq;
    saveUrl();
    paintFilters();
    const wantLib = st.f === 'all' || st.f === 'done';
    const wantJobs = st.f !== 'done';
    const p = new URLSearchParams({ q: st.q, sort: st.sort, limit: String(st.limit), offset: '0' });
    const [lib, jobs] = await Promise.all([wantLib ? getJSON(`/api/library?${p}`) : null, wantJobs ? getJobs(true) : null]);
    if (my !== seq) return;
    let rows = '';
    const q = st.q.toLowerCase();
    if (jobs && jobs.ok && Array.isArray(jobs.data)) {
      let js = jobs.data.slice().reverse();
      if (st.f === 'running' || st.f === 'all') {
        const run = js.filter((j) => (j.status === 'running' || j.status === 'pending') && (!q || j.topic.toLowerCase().includes(q)));
        rows += run.map(jobRow).join('');
      }
      if (st.f === 'failed' || st.f === 'all') {
        const fail = js.filter((j) => j.status === 'failed' && (!q || j.topic.toLowerCase().includes(q)));
        rows += fail.map(jobRow).join('');
      }
    }
    let total = null;
    if (lib && lib.ok && lib.data) {
      rows += lib.data.videos.map(videoRow).join('');
      total = lib.data.total;
      totalNote = `${lib.data.total} video${lib.data.total === 1 ? '' : 's'}${st.q ? ' match' : ' in the library'}`;
    }
    const list = $('list');
    if (lib && !lib.ok) {
      list.innerHTML = `<div class="state"><p class="state-title">Could not load the library</p><p>${esc(missingWhy(lib, 'The library'))}</p><button class="btn" type="button" onclick="location.reload()">Try again</button></div>`;
    } else if (!rows) {
      const empty = {
        running: ['Nothing is running', 'Running jobs are listed here.'],
        failed: ['No failed runs', 'Failed runs since the server last started show up here.'],
      }[st.f] || (st.q ? ['No matches', `Nothing in the library matches "${st.q}".`] : ['No videos yet', 'Finished videos are listed here.']);
      list.innerHTML = `<div class="state"><p class="state-title">${esc(empty[0])}</p><p>${esc(empty[1])}</p>${st.q ? '' : '<a class="btn primary" href="/">Generate video</a>'}</div>`;
    } else {
      list.innerHTML = `<div class="rows">${rows}</div>`;
    }
    const pager = $('pager');
    if (lib && lib.ok && total != null && total > lib.data.videos.length) {
      pager.hidden = false;
      pager.innerHTML = `<span>Showing ${lib.data.videos.length} of ${total}</span><button type="button" class="btn" id="more">Show ${Math.min(PAGE, total - lib.data.videos.length)} more</button>`;
      $('more').addEventListener('click', () => { st.limit = Math.min(100, st.limit + PAGE); load(); });
      if (st.limit >= 100) $('more').hidden = true;
    } else pager.hidden = true;
    paintFoot();
  }

  let qTimer = null;
  $('q').addEventListener('input', () => { clearTimeout(qTimer); qTimer = setTimeout(() => { st.q = $('q').value.trim(); st.limit = PAGE; load(); }, 250); });
  $('sort').addEventListener('change', () => { st.sort = $('sort').value; load(); });
  $('filters').addEventListener('click', (e) => {
    const b = e.target.closest('.chip');
    if (!b) return;
    st.f = b.dataset.f;
    load();
  });

  getVoices().then((v) => { voiceList = v.list || []; load(); });
  loadStats();
  // Keep running rows current without reloading the page.
  setInterval(() => { if (document.querySelector('.vrow.running')) load(); }, 10000);
})();
</script>
</body>
</html>
