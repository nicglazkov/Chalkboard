<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Library · Chalkboard</title>
  <meta name="color-scheme" content="dark light" />
  <script>try{if(localStorage.getItem('cb-theme')==='light')document.documentElement.dataset.theme='light'}catch(e){}</script>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Mono:wght@400;500&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/app.css?v=3" />
  <script src="/app.js?v=3"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="nav" data-page="library"></header>

  <main id="main" class="wrap">
    <div class="lib-head">
      <div>
        <h1 class="page-title">Library</h1>
        <p class="lib-count" id="total-label" aria-live="polite">&nbsp;</p>
      </div>
      <div class="lib-tools" role="search">
        <div class="search">
          <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.5"/><path d="M11 11l3.5 3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          <label for="search" class="sr-only">Search videos</label>
          <input class="input" type="search" id="search" placeholder="Search videos" autocomplete="off" />
          <kbd class="search-key" aria-hidden="true">/</kbd>
        </div>
        <label for="sort" class="sr-only">Sort by</label>
        <select class="select sort" id="sort">
          <option value="newest">Newest</option>
          <option value="oldest">Oldest</option>
          <option value="longest">Longest</option>
          <option value="shortest">Shortest</option>
        </select>
      </div>
    </div>

    <div class="grid" id="grid" aria-live="polite"></div>
    <nav class="pagination" id="pagination" aria-label="Pages" hidden></nav>
  </main>

  <script>
  (function () {
    const { esc, fmtDuration, fmtWhen, thumbInner, resLabel } = window.CB;
    const $ = (id) => document.getElementById(id);
    const grid = $('grid');
    const searchEl = $('search');
    const sortEl = $('sort');
    const totalLabel = $('total-label');
    const pager = $('pagination');

    // State lives in the URL so reloads and back navigation keep it.
    const qs = new URLSearchParams(location.search);
    let perPage = [25, 50, 100].includes(+qs.get('per')) ? +qs.get('per') : 25;
    let page = Math.max(1, parseInt(qs.get('page'), 10) || 1);
    let query = qs.get('q') || '';
    let sort = ['newest', 'oldest', 'longest', 'shortest'].includes(qs.get('sort')) ? qs.get('sort') : 'newest';
    let total = 0;
    let reqId = 0;
    searchEl.value = query;
    sortEl.value = sort;

    function saveUrl() {
      const p = new URLSearchParams();
      if (query) p.set('q', query);
      if (sort !== 'newest') p.set('sort', sort);
      if (page > 1) p.set('page', page);
      if (perPage !== 25) p.set('per', perPage);
      history.replaceState(null, '', '/library' + (p.toString() ? '?' + p : ''));
    }

    const MORE = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg>';

    function card(v) {
      const title = v.title || v.topic;
      const dur = fmtDuration(v.duration_sec);
      const id = esc(v.run_id);
      return `<article class="card" data-run-id="${id}">
        <a class="card-link" href="/library/${encodeURIComponent(v.run_id)}">
          <div class="thumb">${thumbInner(v)}${dur ? `<span class="duration">${dur}</span>` : ''}</div>
          <h2 class="card-title">${esc(title)}</h2>
        </a>
        <p class="card-meta"><span>${esc(fmtWhen(v.created_at))}</span><span class="card-q">${esc(resLabel(v.quality))}</span></p>
        <button class="icon-btn card-menu-btn" type="button" aria-haspopup="true" aria-expanded="false" aria-label="Options for ${esc(title)}">${MORE}</button>
        <div class="menu" hidden>
          <a href="/library/${encodeURIComponent(v.run_id)}">Open</a>
          <button type="button" class="danger" data-delete="${id}" data-title="${esc(title)}">Delete</button>
        </div>
      </article>`;
    }

    function skeletons(n) {
      return Array.from({ length: n }, () => `<div class="card card-skel" aria-hidden="true">
        <div class="thumb skeleton"></div><div class="skeleton skel-line"></div><div class="skeleton skel-line short"></div></div>`).join('');
    }

    function stateHtml(icon, title, body, action) {
      return `<div class="state">${icon}<p class="state-title">${title}</p>${body ? `<p>${body}</p>` : ''}${action || ''}</div>`;
    }
    const ICON_FILM = '<svg viewBox="0 0 48 48" fill="none" aria-hidden="true"><rect x="5" y="10" width="38" height="28" rx="4" stroke="currentColor" stroke-width="2"/><path d="M21 19l9 5-9 5z" fill="currentColor"/></svg>';
    const ICON_SEARCH = '<svg viewBox="0 0 48 48" fill="none" aria-hidden="true"><circle cx="21" cy="21" r="12" stroke="currentColor" stroke-width="2"/><path d="M30 30l10 10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
    const ICON_WARN = '<svg viewBox="0 0 48 48" fill="none" aria-hidden="true"><circle cx="24" cy="24" r="17" stroke="currentColor" stroke-width="2"/><path d="M24 15v11M24 32v1" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>';

    async function load() {
      const my = ++reqId;
      saveUrl();
      grid.setAttribute('aria-busy', 'true');
      if (!grid.querySelector('.card') || grid.querySelector('.state')) grid.innerHTML = skeletons(8);
      else grid.classList.add('is-loading');

      const params = new URLSearchParams({ q: query, sort, limit: perPage, offset: (page - 1) * perPage });
      try {
        let res;
        try { res = await fetch(`/api/library?${params}`); }
        catch { throw new Error('Could not reach the server. Check that it is running.'); }
        if (!res.ok) throw new Error(`The server answered HTTP ${res.status}. The server log has the details.`);
        const data = await res.json();
        if (my !== reqId) return;
        total = data.total;
        // Deleted the last item on the last page: step back a page.
        if (data.videos.length === 0 && total > 0 && page > 1) { page = Math.ceil(total / perPage); return load(); }
        totalLabel.textContent = query
          ? `${total} ${total === 1 ? 'match' : 'matches'} for "${query}"`
          : `${total} ${total === 1 ? 'video' : 'videos'}`;

        if (data.videos.length === 0) {
          grid.innerHTML = query
            ? stateHtml(ICON_SEARCH, 'Nothing matches that search', `No titles or topics contain "${esc(query)}".`,
                '<button class="btn" type="button" id="clear-search">Clear search</button>')
            : stateHtml(ICON_FILM, 'No videos yet', 'Videos you generate are saved here with their script, captions and downloads.',
                '<a class="btn btn-primary" href="/">Generate a video</a>');
          const clear = $('clear-search');
          if (clear) clear.addEventListener('click', () => { searchEl.value = ''; query = ''; page = 1; load(); searchEl.focus(); });
        } else {
          grid.innerHTML = data.videos.map(card).join('');
        }
        renderPager();
      } catch (err) {
        if (my !== reqId) return;
        totalLabel.innerHTML = '&nbsp;';
        grid.innerHTML = stateHtml(ICON_WARN, 'Could not load the library', esc(err.message || 'Could not reach the server.'),
          '<button class="btn" type="button" id="retry">Try again</button>');
        $('retry').addEventListener('click', load);
        pager.hidden = true;
      } finally {
        if (my === reqId) { grid.removeAttribute('aria-busy'); grid.classList.remove('is-loading'); }
      }
    }

    function pageList(cur, n) {
      if (n <= 7) return Array.from({ length: n }, (_, i) => i + 1);
      const out = [1];
      if (cur > 3) out.push('…');
      for (let i = Math.max(2, cur - 1); i <= Math.min(n - 1, cur + 1); i++) out.push(i);
      if (cur < n - 2) out.push('…');
      out.push(n);
      return out;
    }

    function renderPager() {
      const pages = Math.max(1, Math.ceil(total / perPage));
      if (total <= 25) { pager.hidden = true; return; }
      pager.hidden = false;
      let html = '<div class="pages">';
      html += `<button class="page-btn" type="button" data-page="${page - 1}" ${page <= 1 ? 'disabled' : ''} aria-label="Previous page">&#8249;</button>`;
      for (const p of pageList(page, pages)) {
        html += p === '…'
          ? '<span class="page-gap" aria-hidden="true">…</span>'
          : `<button class="page-btn" type="button" data-page="${p}" ${p === page ? 'aria-current="page"' : ''}>${p}</button>`;
      }
      html += `<button class="page-btn" type="button" data-page="${page + 1}" ${page >= pages ? 'disabled' : ''} aria-label="Next page">&#8250;</button></div>`;
      html += `<label class="per-page">Per page <select class="select" id="per-page">
        ${[25, 50, 100].map((n) => `<option value="${n}" ${n === perPage ? 'selected' : ''}>${n}</option>`).join('')}</select></label>`;
      pager.innerHTML = html;
      $('per-page').addEventListener('change', (e) => { perPage = +e.target.value; page = 1; load(); });
    }

    pager.addEventListener('click', (e) => {
      const b = e.target.closest('[data-page]');
      if (!b || b.disabled) return;
      const pages = Math.max(1, Math.ceil(total / perPage));
      const p = +b.dataset.page;
      if (p < 1 || p > pages || p === page) return;
      page = p;
      load();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    let searchTimer = null;
    searchEl.addEventListener('input', () => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => { query = searchEl.value.trim(); page = 1; load(); }, 250);
    });
    sortEl.addEventListener('change', () => { sort = sortEl.value; page = 1; load(); });

    // "/" jumps to search
    document.addEventListener('keydown', (e) => {
      if (e.key === '/' && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) {
        e.preventDefault();
        searchEl.focus();
      }
    });

    // ── Card menus ───────────────────────────────────────────────────────
    function closeMenus(except) {
      grid.querySelectorAll('.card-menu-btn[aria-expanded="true"]').forEach((b) => {
        if (b === except) return;
        b.setAttribute('aria-expanded', 'false');
        b.nextElementSibling.hidden = true;
        b.closest('.card').classList.remove('menu-open');
      });
    }
    grid.addEventListener('click', async (e) => {
      const btn = e.target.closest('.card-menu-btn');
      if (btn) {
        e.stopPropagation();
        const open = btn.getAttribute('aria-expanded') !== 'true';
        closeMenus(btn);
        btn.setAttribute('aria-expanded', String(open));
        btn.nextElementSibling.hidden = !open;
        btn.closest('.card').classList.toggle('menu-open', open);
        if (open) btn.nextElementSibling.querySelector('a, button').focus();
        return;
      }
      const del = e.target.closest('[data-delete]');
      if (del) {
        closeMenus();
        if (!confirm(`Delete "${del.dataset.title}" and all its files? This cannot be undone.`)) return;
        try {
          const res = await fetch(`/api/library/${encodeURIComponent(del.dataset.delete)}?files=true`, { method: 'DELETE' });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          load();
        } catch (err) {
          alert(`Could not delete the video (${err.message}).`);
        }
      }
    });
    document.addEventListener('click', (e) => { if (!e.target.closest('.menu')) closeMenus(); });
    document.addEventListener('keydown', (e) => {
      if (e.key !== 'Escape') return;
      const open = grid.querySelector('.card-menu-btn[aria-expanded="true"]');
      if (open) { closeMenus(); open.focus(); }
    });

    load();
  })();
  </script>
</body>
</html>
