<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Video · Chalkboard</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Serif+Display:ital@0;1&family=Lora:ital,wght@0,400;0,500;1,400&display=swap">
  <link rel="stylesheet" href="/app.css?v=9">
  <script src="/app.js?v=8"></script>
</head>
<body>
<div class="shell">
  <nav class="side" aria-label="Main" data-page="library"></nav>
  <main class="main" id="main">
    <div class="page page-video" id="page">
      <div class="shimmer" style="height:40px;max-width:600px"></div>
      <div class="shimmer" style="aspect-ratio:16/9;max-width:820px"></div>
    </div>
  </main>
</div>

<script>
(function () {
  const { esc, cap, fmtClock, fmtDuration, fmtStamp, fmtBytes, fmtInt, fmtUsd, fmtSpan, fmtSec, parseTs, getJSON, missingWhy, unknownHtml, fileUrl, setMathText, hasMath, resFull, getVoices, narratorName, renderTimeline } = window.CB;
  const $ = (id) => document.getElementById(id);
  const runId = decodeURIComponent(location.pathname.split('/').filter(Boolean).pop());
  const page = $('page');
  const LIMIT = 0.6;

  function problem(title, body, action) {
    page.innerHTML = `<div class="state"><p class="state-title">${esc(title)}</p><p>${esc(body)}</p>${action || ''}</div>`;
  }
  async function fetchText(name) {
    try { const r = await fetch(fileUrl(runId, name)); return r.ok ? await r.text() : null; } catch { return null; }
  }
  async function fetchJson(name) {
    const t = await fetchText(name);
    if (t == null) return null;
    try { return JSON.parse(t); } catch { return null; }
  }
  async function fileSize(name) {
    // A one-byte range request: the total size comes back in Content-Range.
    try {
      const r = await fetch(fileUrl(runId, name), { headers: { Range: 'bytes=0-0' } });
      const m = (r.headers.get('content-range') || '').match(/\/(\d+)$/);
      const n = m ? Number(m[1]) : (r.status === 200 ? Number(r.headers.get('content-length')) : NaN);
      return isFinite(n) && n > 0 ? n : null;
    } catch { return null; }
  }

  function titleHtml(t) {
    // One italic gold word per headline: the last word.
    const m = String(t).match(/^(.*\s)?(\S+?)([.!?:,]*)$/s);
    if (!m) return esc(t);
    return `${esc(m[1] || '')}<em>${esc(m[2])}</em>${esc(m[3] || '')}`;
  }

  function skeleton() {
    page.innerHTML = `
      <nav class="crumb" aria-label="Breadcrumb"><a href="/library"><span aria-hidden="true">‹ </span>Library</a></nav>
      <div class="vid-head">
        <div style="min-width:0;flex:1 1 420px">
          <h1 class="h1" id="title"></h1>
          <div class="meta" id="meta"></div>
        </div>
        <div class="vid-actions">
          <a class="btn" id="regen" href="/">Reuse settings</a>
          <a class="btn primary" id="dl-mp4" hidden download>Download MP4</a>
        </div>
      </div>
      <div class="vid-split">
        <section>
          <div class="player" id="player"></div>
          <div class="tl" id="tl"><div class="shimmer" style="height:60px"></div></div>
          <div class="tabs" role="tablist" id="tabs" aria-label="Video details">
            <button type="button" class="tab" role="tab" id="tab-tx" aria-controls="p-tx">Transcript</button>
            <button type="button" class="tab" role="tab" id="tab-ch" aria-controls="p-ch">Chapters</button>
            <button type="button" class="tab" role="tab" id="tab-qz" aria-controls="p-qz">Quiz</button>
            <button type="button" class="tab" role="tab" id="tab-src" aria-controls="p-src">Sources</button>
            <button type="button" class="tab" role="tab" id="tab-code" aria-controls="p-code">Scene code</button>
          </div>
          <div role="tabpanel" id="p-tx" aria-labelledby="tab-tx"><div class="shimmer" style="height:200px"></div></div>
          <div role="tabpanel" id="p-ch" aria-labelledby="tab-ch" hidden></div>
          <div role="tabpanel" id="p-qz" aria-labelledby="tab-qz" hidden></div>
          <div role="tabpanel" id="p-src" aria-labelledby="tab-src" hidden></div>
          <div role="tabpanel" id="p-code" aria-labelledby="tab-code" hidden></div>
        </section>
        <aside>
          <div class="card" id="quality"><div class="card-head"><span class="label">Quality</span><span class="right" id="q-sum"></span></div><div id="q-body"><div class="shimmer" style="height:90px"></div></div></div>
          <div class="card notes-card"><div class="card-head"><label class="label" for="notes">Notes</label><span class="right notes-state" id="notes-state" role="status" aria-live="polite"></span></div><textarea class="notes-input" id="notes" rows="3" maxlength="10000" placeholder="Add a note about this video" aria-describedby="notes-hint"></textarea><p class="notes-hint" id="notes-hint">Saves when you leave the box<span class="kbd-hint"> or press ${/Mac|iPhone|iPad/.test(navigator.platform) ? '⌘' : 'Ctrl'}+Enter</span></p></div>
          <div class="card"><div class="label">Downloads</div><div id="downloads"></div></div>
          <div class="card"><div class="label">Settings used</div><div id="settings"></div></div>
          <div class="danger-zone"><button type="button" class="btn quiet danger" id="delete">Delete this video</button></div>
        </aside>
      </div>`;
  }

  // ── Tabs ───────────────────────────────────────────────────────────────
  function setupTabs() {
    const tabs = Array.from(document.querySelectorAll('#tabs .tab'));
    const select = (tab, focus) => {
      tabs.forEach((t) => {
        const on = t === tab;
        t.setAttribute('aria-selected', String(on));
        t.tabIndex = on ? 0 : -1;
        $(t.getAttribute('aria-controls')).hidden = !on;
      });
      if (focus) tab.focus();
    };
    tabs.forEach((t, i) => {
      t.addEventListener('click', () => select(t));
      t.addEventListener('keydown', (e) => {
        if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
        select(tabs[(i + (e.key === 'ArrowRight' ? 1 : tabs.length - 1)) % tabs.length], true);
      });
    });
    select(tabs[0]);
    fitTabs();
    window.addEventListener('resize', fitTabs);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitTabs);
  }
  // One line of underlined tabs when they fit; a wrapping segmented control when not,
  // so no tab is ever hidden off the edge.
  function fitTabs() {
    const bar = $('tabs');
    if (!bar) return;
    bar.classList.remove('seg');
    if (bar.scrollWidth > bar.clientWidth + 1) bar.classList.add('seg');
  }
  function tabCount(id, n) {
    const t = $(id);
    const base = t.dataset.base || (t.dataset.base = t.textContent);
    t.innerHTML = esc(base) + (n != null && n > 0 ? `<span class="n"><span class="sr-only">, </span>${esc(String(n))}</span>` : '');
    fitTabs();
  }
  const emptyNote = (msg) => `<p class="note-s" style="margin:.75rem 0">${esc(msg)}</p>`;

  // ── Player + timeline sync ─────────────────────────────────────────────
  let video = null;
  const timeListeners = [];
  function onTime(fn) { timeListeners.push(fn); }
  function seek(t) { if (!video) return; video.currentTime = t; video.play().catch(() => {}); }
  function renderPlayer(v, files) {
    const wrap = $('player');
    if (!files.includes('final.mp4')) {
      wrap.innerHTML = '<div class="state"><p class="state-title">No rendered video</p><p>The render did not finish for this run. The script and other files may still be here.</p></div>';
      return;
    }
    video = document.createElement('video');
    video.controls = true;
    video.preload = 'metadata';
    video.playsInline = true;
    video.src = fileUrl(runId, 'final.mp4');
    if (files.includes('thumb.jpg')) video.poster = fileUrl(runId, 'thumb.jpg');
    wrap.appendChild(video);
    const dl = $('dl-mp4');
    dl.href = video.src;
    dl.hidden = false;
    if (files.includes('captions.srt')) addCaptions();
    let raf = null;
    const tick = () => { timeListeners.forEach((f) => f(video.currentTime)); raf = video.paused ? null : requestAnimationFrame(tick); };
    video.addEventListener('play', () => { if (!raf) raf = requestAnimationFrame(tick); });
    video.addEventListener('timeupdate', () => { if (!raf) timeListeners.forEach((f) => f(video.currentTime)); });
    video.addEventListener('seeked', () => timeListeners.forEach((f) => f(video.currentTime)));
  }
  // Browsers only play WebVTT tracks, so convert captions.srt on the fly.
  async function addCaptions() {
    const srt = await fetchText('captions.srt');
    if (!srt) return;
    const vtt = 'WEBVTT\n\n' + srt.replace(/\r/g, '').replace(/(\d{2}:\d{2}:\d{2}),(\d{3})/g, '$1.$2');
    const track = document.createElement('track');
    track.kind = 'subtitles';
    track.label = 'English';
    track.srclang = 'en';
    track.src = URL.createObjectURL(new Blob([vtt], { type: 'text/vtt' }));
    video.appendChild(track);
  }

  // ── Transcript ─────────────────────────────────────────────────────────
  function renderTranscript(v, segs, tl) {
    const host = $('p-tx');
    let rows = null;
    if (Array.isArray(segs) && segs.length) {
      const tlSegs = tl && Array.isArray(tl.segments) && tl.segments.length === segs.length && tl.segments.every((s) => s.start_s != null) ? tl.segments : null;
      let t = 0;
      rows = segs.map((s, i) => {
        const start = tlSegs ? tlSegs[i].start_s : t;
        t += s.actual_duration_sec || 0;
        return { start, text: s.text || '' };
      });
    }
    if (!rows) {
      tabCount('tab-tx', null);
      if (v.script && v.script.trim()) { host.innerHTML = '<p class="plain" id="tx-plain"></p>'; setMathText($('tx-plain'), v.script); }
      else host.innerHTML = emptyNote('No transcript was saved for this video.');
      return;
    }
    tabCount('tab-tx', rows.length);
    host.innerHTML = '<div class="tx" id="tx"></div>';
    const box = $('tx');
    rows.forEach((r) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'tx-row';
      b.dataset.start = r.start;
      b.innerHTML = `<span class="ts">${fmtClock(r.start)}</span><span class="tt"></span>`;
      b.setAttribute('aria-label', `Play from ${fmtClock(r.start)}`);
      setMathText(b.querySelector('.tt'), r.text);
      box.appendChild(b);
    });
    box.addEventListener('click', (e) => { const row = e.target.closest('.tx-row'); if (row) seek(parseFloat(row.dataset.start)); });
    const els = box.querySelectorAll('.tx-row');
    let active = -1;
    onTime((now) => {
      let idx = 0;
      for (let i = 0; i < rows.length; i++) if (now >= rows[i].start) idx = i;
      if (idx === active) return;
      els.forEach((el, i) => { el.classList.toggle('on', i === idx); el.classList.toggle('past', i < idx); });
      active = idx;
      const el = els[idx];
      if ($('p-tx').hidden) return;
      if (el.offsetTop < box.scrollTop) box.scrollTop = el.offsetTop - 8;
      else if (el.offsetTop + el.offsetHeight > box.scrollTop + box.clientHeight) box.scrollTop = el.offsetTop + el.offsetHeight - box.clientHeight + 8;
    });
  }

  // ── Chapters: chapters.txt (what is embedded in the MP4), else timeline labels
  function parseChapters(txt) {
    if (!txt) return null;
    const out = [];
    let cur = null, base = 1 / 1000;
    for (const line of txt.split('\n')) {
      const l = line.trim();
      if (l === '[CHAPTER]') { cur = {}; out.push(cur); continue; }
      if (!cur) continue;
      const m = l.match(/^(\w+)=(.*)$/);
      if (!m) continue;
      if (m[1] === 'TIMEBASE') { const f = m[2].split('/'); base = Number(f[0]) / Number(f[1]) || base; cur.base = base; }
      else if (m[1] === 'START') cur.start = Number(m[2]);
      else if (m[1] === 'title') cur.title = m[2].replace(/\\(.)/g, '$1');
    }
    return out.filter((c) => c.start != null).map((c) => ({ start: c.start * (c.base || base), title: c.title || '' }));
  }
  function renderChapters(chTxt, tl) {
    let ch = parseChapters(chTxt);
    if ((!ch || !ch.length) && tl && Array.isArray(tl.segments) && tl.segments.every((s) => s.start_s != null && s.label)) {
      ch = tl.segments.map((s) => ({ start: s.start_s, title: s.label }));
    }
    if (!ch || !ch.length) { $('p-ch').innerHTML = emptyNote('No chapters were recorded for this video.'); tabCount('tab-ch', null); return; }
    tabCount('tab-ch', ch.length);
    $('p-ch').innerHTML = `<ul class="chapters">${ch.map((c, i) => `<li><button type="button" data-t="${c.start}"><span class="ts">${fmtClock(c.start)}</span><span>${esc(c.title || 'Chapter ' + (i + 1))}</span></button></li>`).join('')}</ul>`;
    $('p-ch').addEventListener('click', (e) => { const b = e.target.closest('[data-t]'); if (b) seek(parseFloat(b.dataset.t)); });
  }

  // ── Quiz ───────────────────────────────────────────────────────────────
  function renderQuiz(data) {
    const host = $('p-qz');
    const qs = data ? (Array.isArray(data) ? data : data.questions) : null;
    if (!Array.isArray(qs) || !qs.length) { host.innerHTML = emptyNote('No quiz was written for this video.'); tabCount('tab-qz', null); return; }
    tabCount('tab-qz', qs.length);
    const L = 'ABCDEFGH';
    host.innerHTML = '<p class="q-score" id="q-score"></p><ol class="quiz" id="quiz"></ol>';
    let answered = 0, correct = 0;
    const score = () => { $('q-score').textContent = answered ? `${correct} of ${answered} correct${answered === qs.length && correct === qs.length ? '. Perfect score.' : ''}` : `${qs.length} questions. Pick an answer to check it.`; };
    qs.forEach((q, qi) => {
      const li = document.createElement('li');
      li.className = 'q';
      const opts = (q.options || []).map((o) => String(o).replace(/^\s*[A-H][).:]\s+/, ''));
      const answer = String(q.answer || '').trim();
      let ci = L.indexOf(answer.charAt(0).toUpperCase());
      if (answer.length > 1 || ci < 0) { const bt = opts.findIndex((o) => o.trim() === answer.replace(/^\s*[A-H][).:]\s+/, '').trim()); if (bt >= 0) ci = bt; }
      li.innerHTML = '<p class="q-text"></p><div class="q-opts" role="group"></div><p class="q-why" hidden></p>';
      setMathText(li.querySelector('.q-text'), q.question || '');
      const group = li.querySelector('.q-opts');
      group.setAttribute('aria-label', `Answers for question ${qi + 1}`);
      opts.forEach((o, oi) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'q-opt';
        b.innerHTML = `<span class="l">${L[oi]}</span><span class="o"></span>`;
        setMathText(b.querySelector('.o'), o);
        b.addEventListener('click', () => {
          if (li.dataset.done) return;
          li.dataset.done = '1';
          answered++;
          const right = oi === ci;
          if (right) correct++;
          group.querySelectorAll('.q-opt').forEach((x, xi) => { x.disabled = true; if (xi === ci) x.classList.add('right'); else if (xi === oi) x.classList.add('wrong'); });
          const why = li.querySelector('.q-why');
          why.hidden = false;
          setMathText(why, (right ? 'Correct. ' : `Not quite. The answer is ${L[ci] || answer}. `) + (q.explanation || ''));
          score();
        });
        group.appendChild(b);
      });
      $('quiz').appendChild(li);
    });
    score();
  }

  // ── Sources (whatever the run recorded) ─────────────────────────────────
  function renderSources(manifest, v) {
    const m = manifest || {};
    const items = [];
    const push = (x, kind) => {
      if (!x) return;
      if (typeof x === 'string') items.push({ kind, title: x, url: /^https?:/.test(x) ? x : kind === 'repo' ? `https://github.com/${x}` : null });
      else items.push({ kind, title: x.title || x.url || x.name || JSON.stringify(x), url: x.url || null });
    };
    (m.sources || m.research_sources || []).forEach((x) => push(x, 'source'));
    (m.urls || v.urls || []).forEach((x) => push(x, 'link'));
    (m.github || v.github || []).forEach((x) => push(x, 'repo'));
    (m.files || m.uploads || []).forEach((x) => push(typeof x === 'string' ? { title: x } : x, 'file'));
    if (!items.length) { $('p-src').innerHTML = emptyNote('No sources were recorded for this video.'); tabCount('tab-src', null); return; }
    tabCount('tab-src', items.length);
    $('p-src').innerHTML = `<ul class="sources">${items.map((s) => `<li><span class="src-kind">${esc(s.kind)}</span> ${s.url ? `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a>` : esc(s.title)}</li>`).join('')}</ul>`;
  }

  function renderCode(code) {
    if (code == null) { $('p-code').innerHTML = emptyNote('No scene code was saved for this video.'); return; }
    $('p-code').innerHTML = '<pre class="code" tabindex="0" aria-label="Scene code"></pre>';
    $('p-code').querySelector('pre').textContent = code;
  }

  // ── Quality ────────────────────────────────────────────────────────────
  function renderQuality(res) {
    const body = $('q-body');
    const sum = $('q-sum');
    if (!res.ok || !res.data) {
      const why = missingWhy(res, 'The quality report');
      sum.innerHTML = unknownHtml(why);
      body.innerHTML = `<div class="kv"><span>Cues on time</span><span>${unknownHtml(why)}</span></div><div class="kv"><span>Layout check</span><span>${unknownHtml(why)}</span></div><div class="kv"><span>Visual QA</span><span>${unknownHtml(why)}</span></div>`;
      return new Set();
    }
    const d = res.data;
    const late = new Set();
    let issues = 0, html = '';
    const sync = d.sync;
    if (sync && Array.isArray(sync.cues) && sync.cues.length) {
      const lags = sync.cues.map((c) => Number(c.lag_s) || 0);
      const worstAbs = Math.max(...lags.map(Math.abs));
      const max = Math.max(LIMIT * 1.35, worstAbs * 1.1);
      const bars = sync.cues.map((c) => {
        const lag = Number(c.lag_s) || 0;
        const bad = Math.abs(lag) > LIMIT;
        if (bad) { late.add(`${c.segment}:${c.cue - 1}`); issues++; }
        const h = Math.max(2, Math.round((Math.abs(lag) / max) * 100));
        return `<div class="b${bad ? ' late' : ''}" style="height:${h}%" title="Scene ${c.segment + 1}, cue ${c.cue}: ${lag >= 0 ? '+' : ''}${lag.toFixed(2)} s"></div>`;
      }).join('');
      const limitPx = Math.round((LIMIT / max) * 100);
      const why = sync.evidence || 'Renderer time when each cued animation started minus when the word is spoken. Not measured from video frames.';
      html += `<div class="q-cap"><span>Delay per cue</span><span>${LIMIT} s limit</span></div>
        <div class="qbars" role="img" aria-label="Animation delay for ${sync.cues.length} cues, ${late.size} over ${LIMIT} seconds">${bars}<div class="limit" style="bottom:${limitPx}%"></div></div>`;
      const worst = sync.cues.reduce((a, c) => (Math.abs(c.lag_s) > Math.abs(a.lag_s) ? c : a), sync.cues[0]);
      html += `<div class="kv"><span title="${esc(why)}">Cues on time</span><span class="${late.size ? 'c-danger' : 'c-ok'}">${sync.cues.length - late.size} of ${sync.cues.length}</span></div>`;
      html += `<div class="kv"><span>Typical delay</span><span>${sync.median_lag_s != null ? esc(fmtSec(sync.median_lag_s)) : unknownHtml('The report has no median')}</span></div>`;
      if (Math.abs(worst.lag_s) > LIMIT) html += `<div class="kv"><span>Worst cue</span><span class="c-danger">scene ${worst.segment + 1}, cue ${worst.cue}: ${esc(fmtSec(Math.abs(worst.lag_s)))} ${worst.lag_s > 0 ? 'late' : 'early'}</span></div>`;
      else html += `<div class="kv"><span>Longest delay</span><span>${esc(fmtSec(sync.worst_lag_s != null ? sync.worst_lag_s : worstAbs))}</span></div>`;
    } else {
      html += `<div class="kv"><span title="Sync cues are words in the narration that an animation is timed to start on">Cues on time</span><span class="muted">Not recorded</span></div>`;
    }
    const lay = d.layout;
    if (lay) {
      const n = Array.isArray(lay.violations) ? lay.violations.length : 0;
      if (!lay.passed) issues += Math.max(1, n);
      html += `<div class="kv"><span title="A dry run of the scene code before rendering checks where things land on screen">Layout check</span><span class="${lay.passed ? 'c-ok' : 'c-warn'}">${lay.passed ? 'passed' : `${n} problem${n === 1 ? '' : 's'}`}</span></div>`;
    } else html += `<div class="kv"><span>Layout check</span><span class="muted">Not recorded</span></div>`;
    const qa = d.visual_qa;
    if (qa) {
      const n = Array.isArray(qa.issues) ? qa.issues.length : 0;
      if (!qa.passed) issues += Math.max(1, n);
      html += `<div class="kv"><span title="Claude looked at frames of the rendered video for visual problems">Visual QA</span><span class="${qa.passed ? 'c-ok' : 'c-warn'}" title="${qa.checked_at ? 'Checked ' + esc(fmtStamp(qa.checked_at)) : ''}">${qa.passed ? 'passed' : `${n} issue${n === 1 ? '' : 's'}`}</span></div>`;
    } else html += `<div class="kv"><span>Visual QA</span><span class="muted">Not recorded</span></div>`;
    const list = [...((lay && lay.violations) || []).map((x) => ['Layout', x]), ...((qa && qa.issues) || []).map((x) => ['Visual QA', x])];
    if (list.length) {
      html += `<details class="q-flags"><summary>Show what was flagged</summary><ul>${list.map(([k, x]) => `<li>${esc(k)}: ${esc(typeof x === 'string' ? x : (x.message || x.description || x.issue || JSON.stringify(x)))}</li>`).join('')}</ul></details>`;
    }
    if (sync && Array.isArray(sync.cues) && sync.cues.length) html += '<p class="note-s q-explain">A sync cue is a word in the narration that an animation is timed to start on. Delays come from the renderer\'s clock, not from the video frames.</p>';
    body.innerHTML = html;
    const anything = sync || lay || qa;
    sum.innerHTML = !anything ? '<span class="muted">Not recorded</span>' : issues ? `<span class="c-warn">${issues} to look at</span>` : '<span class="c-ok">Nothing flagged</span>';
    return late;
  }

  // ── Notes: saved on blur and Cmd/Ctrl+Enter. "Saved" only after the server confirms.
  function setupNotes(v) {
    const box = $('notes');
    const state = $('notes-state');
    let saved = v.notes || '';
    let busy = false, again = false;
    box.value = saved;
    const show = (text, cls) => { state.textContent = text; state.className = `right notes-state${cls ? ' ' + cls : ''}`; };
    const fit = () => { box.style.height = 'auto'; box.style.height = `${Math.min(box.scrollHeight + 2, 480)}px`; };
    const dirty = () => box.value.trim() !== saved;
    const reason = (r) => {
      if (r.status === 0) return 'the server did not respond';
      const d = r.data && r.data.detail;
      if (Array.isArray(d) && d.length && d[0].msg) return d[0].msg;
      if (r.status === 404) return 'this video is no longer in the library';
      return r.error || `HTTP ${r.status}`;
    };
    async function save() {
      if (!dirty()) return;
      if (busy) { again = true; return; }
      busy = true;
      const sent = box.value;
      show('Saving', 'muted');
      const r = await getJSON(`/api/library/${encodeURIComponent(runId)}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ notes: sent.trim() ? sent : null }),
      });
      busy = false;
      if (r.ok && r.data) {
        saved = r.data.notes || '';
        // Show what the server stored (trimmed) unless the user kept typing meanwhile.
        if (box.value === sent) { box.value = saved; fit(); }
        const t = parseTs(r.data.saved_at);
        show(`Saved · ${t ? new Date(t).toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' }) : 'just now'}`, 'c-ok');
        state.title = r.data.saved_at ? `Saved ${fmtStamp(r.data.saved_at)}` : '';
      } else {
        show(`Not saved: ${reason(r)}`, 'c-danger');
        state.title = '';
      }
      if (again) { again = false; if (dirty()) save(); }
    }
    box.addEventListener('input', () => { fit(); if (dirty()) show('Unsaved', 'muted'); else if (state.textContent === 'Unsaved') show(''); });
    box.addEventListener('blur', save);
    box.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); save(); }
    });
    window.addEventListener('beforeunload', (e) => { if (dirty()) { e.preventDefault(); e.returnValue = ''; } });
    fit();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
  }

  // ── Downloads + settings ───────────────────────────────────────────────
  const DL = [['final.mp4', 'Video (MP4)'], ['captions.srt', 'Captions (SRT)'], ['quiz.json', 'Quiz (JSON)'], ['script.txt', 'Script (TXT)'], ['scene.py', 'Scene code (PY)']];
  async function renderDownloads(files, hasCode) {
    const have = DL.filter(([f]) => files.includes(f) || (f === 'scene.py' && hasCode));
    if (!have.length) { $('downloads').innerHTML = '<p class="note-s">No files to download.</p>'; return; }
    $('downloads').innerHTML = have.map(([f, label]) => `<a class="dl" href="${fileUrl(runId, f)}" download="${esc(f)}">${esc(label)}<span data-size="${esc(f)}"></span></a>`).join('');
    await Promise.all(have.map(async ([f]) => {
      const n = await fileSize(f);
      const el = document.querySelector(`[data-size="${CSS.escape(f)}"]`);
      if (el) el.textContent = n != null ? fmtBytes(n) : '';
    }));
  }
  function renderSettings(v, stats, voiceList) {
    const rows = [
      ['Effort', cap(v.effort) || null],
      ['Narrator', v.narrator ? narratorName(v.narrator, voiceList) : null],
      ['Resolution', resFull(v.quality) || null],
      ['Audience', cap(v.audience) || null],
      ['Tone', cap(v.tone) || null],
      ['Theme', cap(v.theme) || null],
      ['Template', v.template ? cap(v.template) : 'Auto'],
      ['Speed', v.speed != null ? `${v.speed}x` : null],
    ];
    // run_seconds / cost_usd are null for runs without a run record (or resumed runs).
    rows.push(['Run time', v.run_seconds != null ? fmtSpan(v.run_seconds) : null]);
    rows.push(['Claude tokens', stats && stats.input_tokens != null && stats.output_tokens != null ? fmtInt(stats.input_tokens + stats.output_tokens) : null]);
    rows.push(['Cost', v.cost_usd != null ? fmtUsd(v.cost_usd) : null]);
    $('settings').innerHTML = rows.map(([k, val]) => `<div class="kv"><span>${esc(k)}</span>${val != null ? `<span>${esc(val)}</span>` : '<span class="muted">Not recorded</span>'}</div>`).join('');
    const p = new URLSearchParams({ topic: v.topic, effort: v.effort || 'medium', audience: v.audience || 'intermediate', tone: v.tone || 'casual', theme: v.theme || 'chalkboard', speed: v.speed != null ? v.speed : 1.0 });
    if (v.template) p.set('template', v.template);
    if (['low', 'medium', 'high', '4k'].includes(v.quality)) p.set('quality', v.quality);
    if (v.narrator) p.set('narrator', v.narrator);
    $('regen').href = `/?${p}`;
  }

  // ── Load ───────────────────────────────────────────────────────────────
  async function load() {
    const res = await getJSON(`/api/library/${encodeURIComponent(runId)}`);
    if (res.status === 404) { problem('Video not found', 'It may have been deleted, or the link is wrong.', '<a class="btn" href="/library">Back to the library</a>'); return; }
    if (!res.ok) { problem('Could not load this video', missingWhy(res, 'The video'), '<button class="btn" type="button" onclick="location.reload()">Try again</button>'); return; }
    const v = res.data;
    const files = v.output_files || [];
    const title = v.title || v.topic;
    document.title = `${title} · Chalkboard`;
    skeleton();
    setupTabs();
    if (hasMath(title)) setMathText($('title'), title); else $('title').innerHTML = titleHtml(title);

    renderPlayer(v, files);
    setupNotes(v);
    const [tlRes, qRes, segs, chTxt, quiz, manifest, code, stats, voices] = await Promise.all([
      getJSON(`/api/library/${encodeURIComponent(runId)}/timeline`),
      getJSON(`/api/library/${encodeURIComponent(runId)}/quality`),
      files.includes('segments.json') ? fetchJson('segments.json') : null,
      files.includes('chapters.txt') ? fetchText('chapters.txt') : null,
      files.includes('quiz.json') ? fetchJson('quiz.json') : null,
      files.includes('manifest.json') ? fetchJson('manifest.json') : null,
      fetchText('scene.py'),
      v.run_stats || null,
      getVoices(),
    ]);
    const tl = tlRes.ok ? tlRes.data : null;
    const late = renderQuality(qRes);

    // Timeline with a playhead that follows the video
    const tlHost = $('tl');
    let tlApi = null;
    if (tl) tlApi = renderTimeline(tlHost, tl, { mode: 'video', lateCues: late, onSeek: video ? seek : null, emptyText: 'No segments were recorded for this video.' });
    else tlHost.innerHTML = `<div class="tl-note">${esc(missingWhy(tlRes, 'The timeline'))}</div>`;
    if (tlApi) { onTime((t) => tlApi.setTime(t)); tlApi.setTime(0); }

    const meta = [
      fmtDuration(v.duration_sec), resFull(v.quality), v.narrator ? narratorName(v.narrator, voices.list) : '', v.effort ? `${v.effort} effort` : '',
      tlApi ? `${tlApi.segments} scenes` : '', tlApi && tlApi.cues ? `${tlApi.cues} sync cues` : '', fmtStamp(v.created_at),
    ].filter(Boolean);
    $('meta').textContent = meta.join(' · ');

    renderTranscript(v, segs, tl);
    renderChapters(chTxt, tl);
    renderQuiz(quiz);
    renderSources(manifest, v);
    renderCode(code);
    renderSettings(v, stats, voices.list);
    renderDownloads(files, code != null);

    $('delete').addEventListener('click', async () => {
      if (!confirm('Delete this video and all its files? This cannot be undone.')) return;
      const r = await getJSON(`/api/library/${encodeURIComponent(runId)}?files=true`, { method: 'DELETE' });
      if (r.ok) location.href = '/library'; else alert(`Could not delete the video (${r.error}).`);
    });
  }
  load().catch((err) => { console.error(err); problem('Could not load this video', String(err.message || err), '<button class="btn" type="button" onclick="location.reload()">Try again</button>'); });
})();
</script>
</body>
</html>
