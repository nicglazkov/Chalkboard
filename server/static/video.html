<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Video · Chalkboard</title>
  <meta name="color-scheme" content="dark light" />
  <script>try{if(localStorage.getItem('cb-theme')==='light')document.documentElement.dataset.theme='light'}catch(e){}</script>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Mono:wght@400;500&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/app.css?v=1" />
  <script src="/app.js?v=1"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="nav" data-page="library"></header>

  <main id="main" class="wrap">
    <nav class="crumbs" aria-label="Breadcrumb">
      <a href="/library">
        <svg viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="M7.5 2.5L4 6l3.5 3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Library
      </a>
    </nav>

    <!-- Loading skeleton -->
    <div id="loading" class="v-skel" aria-busy="true" aria-label="Loading video">
      <div class="skeleton" style="height:2.2rem;width:min(520px,80%)"></div>
      <div class="skeleton" style="height:0.9rem;width:220px;margin-top:12px"></div>
      <div class="v-grid" style="margin-top:28px">
        <div class="skeleton" style="aspect-ratio:16/9;border-radius:var(--r-lg)"></div>
        <div class="skeleton" style="height:260px;border-radius:var(--r-lg)"></div>
      </div>
    </div>

    <!-- Not found / failed to load -->
    <div id="problem" hidden></div>

    <article id="content" hidden>
      <header class="v-head">
        <h1 class="page-title" id="video-title"></h1>
        <p class="v-topic" id="video-topic" hidden></p>
        <p class="v-meta" id="video-meta"></p>
      </header>

      <div class="v-grid">
        <div class="v-main">
          <div class="player" id="player-wrap"></div>

          <div class="tabs" role="tablist" aria-label="Video text" id="tabs" hidden>
            <button class="tab" role="tab" id="tab-transcript" aria-controls="panel-transcript" aria-selected="true">Transcript</button>
            <button class="tab" role="tab" id="tab-quiz" aria-controls="panel-quiz" aria-selected="false" tabindex="-1" hidden>Quiz <span class="tab-n" id="quiz-count"></span></button>
          </div>

          <section class="tab-panel" id="panel-transcript" role="tabpanel" aria-labelledby="tab-transcript">
            <div class="transcript" id="script-text"></div>
          </section>
          <section class="tab-panel" id="panel-quiz" role="tabpanel" aria-labelledby="tab-quiz" hidden>
            <p class="quiz-score" id="quiz-score" aria-live="polite"></p>
            <ol class="quiz" id="quiz-list"></ol>
          </section>
        </div>

        <aside class="v-side">
          <a class="btn btn-primary btn-block" id="dl-video" hidden download="final.mp4">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2v8M4.5 6.5L8 10l3.5-3.5M2.5 13.5h11"/></svg>
            Download video
          </a>

          <section class="side-block" id="downloads-panel">
            <h2 class="panel-title">Files</h2>
            <ul class="files" id="download-list"></ul>
          </section>

          <section class="side-block">
            <h2 class="panel-title">Settings</h2>
            <dl class="params" id="params-grid"></dl>
            <a class="btn btn-block" id="regen-btn" href="/">Generate again with these settings</a>
          </section>

          <section class="side-block" id="related-panel" hidden>
            <h2 class="panel-title">Related videos</h2>
            <div class="related" id="related-list"></div>
          </section>

          <button class="btn btn-quiet btn-sm v-delete" id="delete-btn" type="button">Delete video</button>
        </aside>
      </div>
    </article>
  </main>

  <script>
  (function () {
    const { esc, fmtDuration, fmtClock, fmtDate, fileUrl, thumbInner, setMathText, resLabel } = window.CB;
    const $ = (id) => document.getElementById(id);
    const runId = decodeURIComponent(location.pathname.split('/').filter(Boolean).pop());

    const FILE_LABELS = {
      'scene.py': 'Manim source',
      'script.txt': 'Script',
      'captions.srt': 'Captions',
      'segments.json': 'Segments',
      'manifest.json': 'Manifest',
      'quiz.json': 'Quiz',
      'chapters.txt': 'Chapters',
      'voiceover.wav': 'Voiceover',
    };
    const FILE_ORDER = ['captions.srt', 'script.txt', 'quiz.json', 'chapters.txt', 'segments.json', 'manifest.json', 'scene.py'];
    const cap = (s) => (s ? String(s).charAt(0).toUpperCase() + String(s).slice(1) : s);

    function problem(title, body, action) {
      $('loading').remove();
      $('problem').hidden = false;
      $('problem').innerHTML = `<div class="state">
        <svg viewBox="0 0 48 48" fill="none" aria-hidden="true"><rect x="5" y="10" width="38" height="28" rx="4" stroke="currentColor" stroke-width="2"/><path d="M19 19l10 10M29 19L19 29" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <p class="state-title">${title}</p><p>${body}</p>${action}</div>`;
    }

    // Browsers only play WebVTT tracks, so convert captions.srt on the fly.
    async function addCaptions(videoEl, v) {
      try {
        const r = await fetch(fileUrl(v.run_id, 'captions.srt'));
        if (!r.ok) return;
        const srt = (await r.text()).replace(/\r/g, '');
        const vtt = 'WEBVTT\n\n' + srt.replace(/(\d{2}:\d{2}:\d{2}),(\d{3})/g, '$1.$2');
        const track = document.createElement('track');
        track.kind = 'subtitles';
        track.label = 'English';
        track.srclang = 'en';
        track.src = URL.createObjectURL(new Blob([vtt], { type: 'text/vtt' }));
        videoEl.appendChild(track);
      } catch { /* captions are optional */ }
    }

    function renderPlayer(v, files) {
      const wrap = $('player-wrap');
      if (!files.includes('final.mp4')) {
        wrap.classList.add('player-missing');
        wrap.innerHTML = `<div class="state"><svg viewBox="0 0 48 48" fill="none" aria-hidden="true"><rect x="5" y="10" width="38" height="28" rx="4" stroke="currentColor" stroke-width="2"/><path d="M21 19l9 5-9 5z" fill="currentColor"/></svg>
          <p class="state-title">No rendered video</p><p>The render did not finish for this run. The script and other files are still available.</p></div>`;
        return null;
      }
      const video = document.createElement('video');
      video.controls = true;
      video.preload = 'metadata';
      video.playsInline = true;
      video.src = fileUrl(v.run_id, 'final.mp4');
      if (v.thumb_path) video.poster = fileUrl(v.run_id, 'thumb.jpg');
      wrap.appendChild(video);
      if (files.includes('captions.srt')) addCaptions(video, v);
      const dl = $('dl-video');
      dl.href = video.src;
      dl.hidden = false;
      return video;
    }

    function renderFiles(v, files) {
      const list = files
        .filter((f) => f !== 'final.mp4' && !f.endsWith('.jpg'))
        .sort((a, b) => {
          const ia = FILE_ORDER.indexOf(a), ib = FILE_ORDER.indexOf(b);
          return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib) || a.localeCompare(b);
        });
      if (!list.length) { $('downloads-panel').remove(); return; }
      $('download-list').innerHTML = list.map((f) => {
        const ext = f.split('.').pop();
        return `<li><a class="file-link" href="${fileUrl(v.run_id, f)}" download="${esc(f)}">
          <span>${esc(FILE_LABELS[f] || f)}</span><span class="file-ext">${esc(ext)}</span></a></li>`;
      }).join('');
    }

    function renderParams(v) {
      const rows = [
        ['Effort', cap(v.effort)],
        ['Audience', cap(v.audience)],
        ['Tone', cap(v.tone)],
        ['Theme', cap(v.theme)],
        ['Template', v.template ? cap(v.template) : 'None'],
        ['Speed', v.speed != null ? `${v.speed}x` : ''],
        ['Resolution', resLabel(v.quality)],
        ['Length', fmtDuration(v.duration_sec)],
      ];
      $('params-grid').innerHTML = rows.map(([k, val]) =>
        `<div><dt>${k}</dt><dd>${esc(val || 'Unknown')}</dd></div>`).join('');
      const p = new URLSearchParams({
        topic: v.topic,
        effort: v.effort || 'medium',
        audience: v.audience || 'intermediate',
        tone: v.tone || 'casual',
        theme: v.theme || 'chalkboard',
        speed: v.speed != null ? v.speed : 1.0,
      });
      if (v.template) p.set('template', v.template);
      if (['low', 'medium', 'high', '4k'].includes(v.quality)) p.set('quality', v.quality);
      $('regen-btn').href = `/?${p}`;
    }

    // ── Transcript ──────────────────────────────────────────────────────
    async function renderTranscript(v, files, video) {
      const box = $('script-text');
      let segs = null;
      if (files.includes('segments.json')) {
        try {
          const r = await fetch(fileUrl(v.run_id, 'segments.json'));
          if (r.ok) segs = await r.json();
        } catch {}
      }
      if (Array.isArray(segs) && segs.length) {
        let t = 0;
        const rows = segs.map((s) => { const start = t; t += s.actual_duration_sec || 0; return { start, text: s.text || '' }; });
        box.innerHTML = '';
        rows.forEach((r, i) => {
          const b = document.createElement('button');
          b.type = 'button';
          b.className = 'tx-row';
          b.dataset.start = r.start;
          b.innerHTML = `<span class="tx-ts">${fmtClock(r.start)}</span><span class="tx-text"></span>`;
          b.setAttribute('aria-label', `Play from ${fmtClock(r.start)}`);
          setMathText(b.querySelector('.tx-text'), r.text);
          box.appendChild(b);
        });
        if (!video) box.classList.add('no-seek');
        box.addEventListener('click', (e) => {
          const row = e.target.closest('.tx-row');
          if (!row || !video) return;
          video.currentTime = parseFloat(row.dataset.start);
          video.play().catch(() => {});
        });
        if (video) {
          const els = box.querySelectorAll('.tx-row');
          let active = -1;
          video.addEventListener('timeupdate', () => {
            const now = video.currentTime;
            let idx = 0;
            for (let i = 0; i < rows.length; i++) if (now >= rows[i].start) idx = i;
            if (idx === active) return;
            if (active >= 0) els[active].classList.remove('active');
            els[idx].classList.add('active');
            active = idx;
            // Scroll inside the transcript box only, never the page.
            const el = els[idx];
            if (el.offsetTop < box.scrollTop) box.scrollTop = el.offsetTop - 8;
            else if (el.offsetTop + el.offsetHeight > box.scrollTop + box.clientHeight)
              box.scrollTop = el.offsetTop + el.offsetHeight - box.clientHeight + 8;
          });
        }
        return true;
      }
      if (v.script && v.script.trim()) {
        box.classList.add('script-plain');
        setMathText(box, v.script);
        return true;
      }
      return false;
    }

    // ── Quiz ────────────────────────────────────────────────────────────
    async function renderQuiz(v, files) {
      if (!files.includes('quiz.json')) return false;
      let qs;
      try {
        const r = await fetch(fileUrl(v.run_id, 'quiz.json'));
        if (!r.ok) return false;
        const data = await r.json();
        qs = Array.isArray(data) ? data : data.questions;
      } catch { return false; }
      if (!Array.isArray(qs) || !qs.length) return false;

      const LETTERS = 'ABCDEFGH';
      const list = $('quiz-list');
      let answered = 0, correct = 0;
      const score = () => {
        $('quiz-score').textContent = answered
          ? `${correct} of ${answered} correct${answered === qs.length && correct === qs.length ? '. Perfect score.' : ''}`
          : `${qs.length} questions. Pick an answer to check it.`;
      };
      qs.forEach((q, qi) => {
        const li = document.createElement('li');
        li.className = 'q';
        const opts = (q.options || []).map((o) => String(o).replace(/^\s*[A-H][).:]\s+/, ''));
        const answer = String(q.answer || '').trim();
        let correctIdx = LETTERS.indexOf(answer.charAt(0).toUpperCase());
        if (answer.length > 1 || correctIdx < 0) {
          const byText = opts.findIndex((o) => o.trim() === answer.replace(/^\s*[A-H][).:]\s+/, '').trim());
          if (byText >= 0) correctIdx = byText;
        }
        li.innerHTML = `<p class="q-text"></p><div class="q-opts" role="group"></div><p class="q-why" hidden></p>`;
        setMathText(li.querySelector('.q-text'), q.question || '');
        const group = li.querySelector('.q-opts');
        group.setAttribute('aria-label', `Answers for question ${qi + 1}`);
        opts.forEach((o, oi) => {
          const b = document.createElement('button');
          b.type = 'button';
          b.className = 'q-opt';
          b.innerHTML = `<span class="q-letter">${LETTERS[oi]}</span><span class="q-o"></span>`;
          setMathText(b.querySelector('.q-o'), o);
          b.addEventListener('click', () => {
            if (li.classList.contains('answered')) return;
            li.classList.add('answered');
            answered++;
            const right = oi === correctIdx;
            if (right) correct++;
            group.querySelectorAll('.q-opt').forEach((x, xi) => {
              x.disabled = true;
              if (xi === correctIdx) x.classList.add('is-right');
              else if (xi === oi) x.classList.add('is-wrong');
            });
            const why = li.querySelector('.q-why');
            why.hidden = false;
            setMathText(why, (right ? 'Correct. ' : `Not quite. The answer is ${LETTERS[correctIdx] || answer}. `) + (q.explanation || ''));
            score();
          });
          group.appendChild(b);
        });
        list.appendChild(li);
      });
      $('quiz-count').textContent = qs.length;
      score();
      return true;
    }

    function setupTabs(hasTranscript, hasQuiz) {
      const tTab = $('tab-transcript'), qTab = $('tab-quiz');
      if (!hasTranscript) { tTab.hidden = true; $('panel-transcript').hidden = true; }
      if (hasQuiz) qTab.hidden = false;
      if (!hasTranscript && !hasQuiz) return;
      $('tabs').hidden = false;
      const tabs = [tTab, qTab].filter((t) => !t.hidden);
      const select = (tab) => {
        for (const t of tabs) {
          const on = t === tab;
          t.setAttribute('aria-selected', String(on));
          t.tabIndex = on ? 0 : -1;
          $(t.getAttribute('aria-controls')).hidden = !on;
        }
      };
      select(tabs[0]);
      tabs.forEach((t, i) => {
        t.addEventListener('click', () => select(t));
        t.addEventListener('keydown', (e) => {
          if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
          const n = tabs[(i + (e.key === 'ArrowRight' ? 1 : tabs.length - 1)) % tabs.length];
          select(n); n.focus();
        });
      });
    }

    async function renderRelated(v) {
      try {
        const words = v.topic.split(/\s+/).slice(0, 3).join(' ');
        const r = await fetch(`/api/library?q=${encodeURIComponent(words)}&limit=5&sort=newest`);
        if (!r.ok) return;
        const others = (await r.json()).videos.filter((x) => x.run_id !== v.run_id).slice(0, 4);
        if (!others.length) return;
        $('related-list').innerHTML = others.map((x) => `
          <a class="rel" href="/library/${encodeURIComponent(x.run_id)}">
            <div class="thumb">${thumbInner(x)}</div>
            <div class="rel-text"><span class="rel-title">${esc(x.title || x.topic)}</span>
            <span class="rel-date">${esc(fmtDate(x.created_at))}</span></div>
          </a>`).join('');
        $('related-panel').hidden = false;
      } catch {}
    }

    $('delete-btn').addEventListener('click', async () => {
      if (!confirm('Delete this video and all its files? This cannot be undone.')) return;
      try {
        const res = await fetch(`/api/library/${encodeURIComponent(runId)}?files=true`, { method: 'DELETE' });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        location.href = '/library';
      } catch (err) {
        alert(`Could not delete the video (${err.message}).`);
      }
    });

    async function load() {
      let res;
      try {
        res = await fetch(`/api/library/${encodeURIComponent(runId)}`);
      } catch {
        problem('Could not load this video', 'The server did not respond. Check that it is running.',
          '<button class="btn" type="button" onclick="location.reload()">Try again</button>');
        return;
      }
      if (res.status === 404) {
        problem('Video not found', 'It may have been deleted, or the link is wrong.',
          '<a class="btn" href="/library">Back to the library</a>');
        return;
      }
      if (!res.ok) {
        problem('Could not load this video', `The server answered HTTP ${res.status}.`,
          '<button class="btn" type="button" onclick="location.reload()">Try again</button>');
        return;
      }
      const v = await res.json();
      const files = v.output_files || [];
      const title = v.title || v.topic;
      document.title = `${title} · Chalkboard`;

      $('loading').remove();
      $('content').hidden = false;
      setMathText($('video-title'), title);
      if (v.title && v.topic && v.title !== v.topic) {
        $('video-topic').hidden = false;
        setMathText($('video-topic'), v.topic);
      }
      $('video-meta').innerHTML = [fmtDuration(v.duration_sec), fmtDate(v.created_at, true)]
        .filter(Boolean).map((s) => `<span>${esc(s)}</span>`).join('');

      const video = renderPlayer(v, files);
      renderFiles(v, files);
      renderParams(v);
      const [hasTx, hasQuiz] = await Promise.all([renderTranscript(v, files, video), renderQuiz(v, files)]);
      setupTabs(hasTx, hasQuiz);
      renderRelated(v);
    }

    load().catch((err) => {
      console.error(err);
      if ($('loading')) problem('Could not load this video', esc(err.message), '<button class="btn" type="button" onclick="location.reload()">Try again</button>');
    });
  })();
  </script>
</body>
</html>
